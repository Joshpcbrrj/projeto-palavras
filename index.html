<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Política de segurança: só carrega código do próprio site e das CDNs usadas, e só
      conversa com a Wikipédia e o Gemini. Protege a chave do Gemini guardada no navegador.
      O hash corresponde ao script de tema abaixo (um teste confere; ao editá-lo, atualize).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-apVhL5tdoXsVhciYorMcrLGyHyDoB+RT+HE0CLGmDj8=' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://*.wikipedia.org https://generativelanguage.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aprendendo Palavras</title>
    <meta
      name="description"
      content="Aprenda inglês de forma simples: textos no seu nível, pronúncia, flashcards, PDFs revisáveis e MP3."
    />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Palavras" />

    <script>
      // Aplica o tema antes da primeira pintura para evitar o "flash" de tema errado.
      (function () {
        var tema = null;
        try {
          tema = (JSON.parse(localStorage.getItem('ap_preferencias')) || {}).tema;
          if (!tema) tema = localStorage.getItem('theme');
        } catch (e) {}
        if (tema !== 'dark' && tema !== 'light') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = tema;
        // O Windows não tem emojis de bandeira; usa a fonte de bandeiras embutida.
        if (/Windows/.test(navigator.userAgent)) {
          document.documentElement.classList.add('bandeiras-polyfill');
        }
        // Se o app não abrir em alguns segundos (ex.: arquivos antigos no cache do modo
        // offline), mostra um aviso com um botão que limpa esse cache e recarrega.
        setTimeout(function () {
          var app = document.getElementById('app');
          if (!app || document.documentElement.dataset.appPronto) return;
          app.innerHTML =
            '<div class="cartao" style="text-align:center">' +
            '<h2 class="secao__titulo">O app não carregou</h2>' +
            '<p class="texto-suave">Isso pode acontecer logo depois de uma atualização. ' +
            'Clique abaixo para baixar a versão mais nova (seu progresso não é apagado).</p>' +
            '<p><button type="button" class="btn btn--primario" id="btnAtualizarApp">' +
            'Atualizar o app</button></p></div>';
          document.getElementById('btnAtualizarApp').addEventListener('click', function () {
            var limpar = [];
            if (navigator.serviceWorker) {
              limpar.push(
                navigator.serviceWorker.getRegistrations().then(function (registros) {
                  return Promise.all(registros.map(function (r) { return r.unregister(); }));
                })
              );
            }
            if (window.caches) {
              limpar.push(
                caches.keys().then(function (nomes) {
                  // Só o cache do app: o modelo da voz do MP3 (centenas de MB) fica guardado.
                  return Promise.all(
                    nomes
                      .filter(function (n) { return n.indexOf('aprendendo-palavras') === 0; })
                      .map(function (n) { return caches.delete(n); })
                  );
                })
              );
            }
            Promise.all(limpar).then(
              function () { location.reload(); },
              function () { location.reload(); }
            );
          });
        }, 6000);
      })();
    </script>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screens.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="pular" href="#app">Pular para o conteúdo</a>

    <header class="topo">
      <a class="marca" href="#/" aria-label="Aprendendo Palavras — início">
        <img class="marca__logo" src="icons/icon.svg" alt="" width="40" height="40" />
        <span class="marca__textos">
          <span class="marca__nome">Aprendendo Palavras</span>
          <span class="marca__slogan">Aprenda inglês de forma simples</span>
        </span>
      </a>
      <nav class="topo__acoes">
        <button type="button" id="btnInicio" class="btn btn--vidro" hidden>
          🏠 <span class="so-desktop">Início</span>
        </button>
        <a
          href="#/configuracoes"
          class="btn btn--vidro btn--icone"
          aria-label="Configurações"
          title="Configurações"
          >⚙️</a
        >
        <button
          type="button"
          id="btnTema"
          class="btn btn--vidro btn--icone"
          aria-pressed="false"
          aria-label="Alternar tema"
        >
          <span class="icone-tema icone-tema--lua" aria-hidden="true">🌙</span>
          <span class="icone-tema icone-tema--sol" aria-hidden="true">☀️</span>
        </button>
      </nav>
    </header>

    <main id="app" class="conteudo" tabindex="-1">
      <noscript>
        <div class="cartao">Ative o JavaScript para usar o Aprendendo Palavras.</div>
      </noscript>
    </main>

    <footer class="rodape">
      <span class="rodape__textos">
        <span>Aprendendo Palavras · código aberto (MIT)</span>
        <a href="https://github.com/Joshpcbrrj/projeto-palavras" target="_blank" rel="noopener"
          >GitHub</a
        >
      </span>
      <span class="rodape__versao" id="versaoApp" title="Versão do app"></span>
    </footer>
  </body>
</html>
