name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, formatação e testes (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/

  publicar-cobertura:
    name: Publicar cobertura no Codecov
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v7
        with:
          name: cobertura
          path: coverage

      - name: Enviar cobertura ao Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false
